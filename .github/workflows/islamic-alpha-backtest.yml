name: Historical indicator backtest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'alpha-desk-pwa/backtest_5m.py'
      - 'alpha-desk-pwa/strategy_engine.py'
      - '.github/workflows/islamic-alpha-backtest.yml'
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run causal indicator backtest on public INTC 5-minute sample
        run: python alpha-desk-pwa/backtest_5m.py
      - name: Commit technical test result without secrets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alpha-desk-pwa/reports/historical_backtest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record historical indicator backtest (research only) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
